name: backend

on:
  push:
    paths:
    - ".github/workflows/backend.yml"
    - "CMakeLists.txt"
    - "src/*"
    - "test/*"
    - "scripts/*"
  pull_request:
    paths:
    - ".github/workflows/backend.yml"
    - "CMakeLists.txt"
    - "src/*"
    - "test/*"
    - "scripts/*"
  workflow_call:

env:
  TTYD_VERSION: 1.7.8

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev python3
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTC_BUILD_TESTS=ON -DTC_WARNINGS_AS_ERRORS=ON
          cmake --build build --parallel
      - name: Unit tests
        run: ./build/unit-tests
      - name: Build ttyd (test server)
        run: |
          sudo apt-get install -y libwebsockets-dev libjson-c-dev libuv1-dev zlib1g-dev
          git clone --depth 1 --branch "$TTYD_VERSION" https://github.com/tsl0922/ttyd.git ttyd
          cmake -S ttyd -B ttyd/build -DCMAKE_BUILD_TYPE=Release
          cmake --build ttyd/build --parallel
      - name: Integration tests
        env:
          SERVER: ${{ github.workspace }}/ttyd/build/ttyd
          CLIENT: ${{ github.workspace }}/build/ttyd-client
        run: python3 test/integration.py
      - uses: actions/upload-artifact@v7
        with:
          name: ttyd-client.linux-x86_64
          path: build/ttyd-client

  musl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake musl-tools python3
      - name: Static musl build (no TLS)
        run: make static BUILD_DIR=build-musl TLS=0
      - name: Verify the binary is static
        run: |
          file build-musl/ttyd-client | tee /tmp/file.txt
          grep -q "statically linked" /tmp/file.txt
          ./build-musl/ttyd-client --version
      - name: Build ttyd (test server)
        run: |
          sudo apt-get install -y libwebsockets-dev libjson-c-dev libuv1-dev zlib1g-dev
          git clone --depth 1 --branch "$TTYD_VERSION" https://github.com/tsl0922/ttyd.git ttyd
          cmake -S ttyd -B ttyd/build -DCMAKE_BUILD_TYPE=Release
          cmake --build ttyd/build --parallel
      - name: Integration tests against the static binary
        env:
          SERVER: ${{ github.workspace }}/ttyd/build/ttyd
          CLIENT: ${{ github.workspace }}/build-musl/ttyd-client
        run: python3 test/integration.py basic escape readonly auth eof flow
      - uses: actions/upload-artifact@v7
        with:
          name: ttyd-client.musl-x86_64
          path: build-musl/ttyd-client

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev python3
      - name: Build with ASan and UBSan
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DTC_BUILD_TESTS=ON \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build --parallel
      - name: Unit tests
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./build/unit-tests
      - name: Build ttyd (test server)
        run: |
          sudo apt-get install -y libwebsockets-dev libjson-c-dev libuv1-dev zlib1g-dev
          git clone --depth 1 --branch "$TTYD_VERSION" https://github.com/tsl0922/ttyd.git ttyd
          cmake -S ttyd -B ttyd/build -DCMAKE_BUILD_TYPE=Release
          cmake --build ttyd/build --parallel
      - name: Integration tests
        env:
          SERVER: ${{ github.workspace }}/ttyd/build/ttyd
          CLIENT: ${{ github.workspace }}/build/ttyd-client
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: python3 test/integration.py

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install packages
        run: brew install cmake openssl@3
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTC_BUILD_TESTS=ON \
            -DCMAKE_PREFIX_PATH="$(brew --prefix openssl@3)"
          cmake --build build --parallel
      - name: Unit tests
        run: ./build/unit-tests
      - name: Smoke test
        run: ./build/ttyd-client --version
      - uses: actions/upload-artifact@v7
        with:
          name: ttyd-client.macos
          path: build/ttyd-client

  msvc:
    runs-on: windows-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_EXE: ${{ github.workspace }}/vcpkg/vcpkg.exe
      VCPKG_TRIPLET: x64-windows-static
      TOOLCHAIN_FILE: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
    steps:
      - uses: actions/checkout@v6
      - name: Checkout vcpkg
        uses: actions/checkout@v6
        with:
          repository: microsoft/vcpkg
          path: vcpkg
      - name: Bootstrap vcpkg
        shell: pwsh
        run: ${{ github.workspace }}/vcpkg/bootstrap-vcpkg.bat
      - name: Install dependencies
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = "${{ env.VCPKG_ROOT }}"
          ${{ env.VCPKG_EXE }} install --triplet ${{ env.VCPKG_TRIPLET }} openssl getopt-win32
      - name: Build with MSVC
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = "${{ env.VCPKG_ROOT }}"
          # Match x64-windows-static's /MT runtime; avoid mixing static and DLL CRTs.
          cmake -S . -B build -G "Visual Studio 18 2026" -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="${{ env.TOOLCHAIN_FILE }}" -DVCPKG_TARGET_TRIPLET=${{ env.VCPKG_TRIPLET }} -DCMAKE_POLICY_DEFAULT_CMP0091=NEW '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded$<$<CONFIG:Debug>:Debug>'
          cmake --build build --config Release
      - name: Smoke test
        run: build/Release/ttyd-client.exe --version
      - uses: actions/upload-artifact@v7
        with:
          name: ttyd-client.msvc
          path: build/Release/ttyd-client.exe

  cross:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [i686, x86_64, arm, armhf, aarch64, mips, mipsel, mips64, mips64el, ppc64, ppc64le, s390x, win32]
    steps:
      - uses: actions/checkout@v6
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake build-essential cmake curl file libtool patch perl
      - name: Cross build (${{ matrix.target }})
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: ./scripts/cross-build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ttyd-client.${{ matrix.target }}
          path: build/ttyd-client*
