name: backend

on:
  push:
    paths:
      - ".github/workflows/backend.yml"
      - "CMakeLists.txt"
      - "src/*"
      - "test/*"
      - "scripts/*"
  pull_request:
    paths:
      - ".github/workflows/backend.yml"
      - "CMakeLists.txt"
      - "src/*"
      - "test/*"
      - "scripts/*"
  workflow_call:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev python3

      - name: Build ttyd-client
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTC_WARNINGS_AS_ERRORS=ON
          cmake --build build --parallel

      - uses: actions/upload-artifact@v7
        with:
          name: ttyd-client.linux-x86_64
          path: build/ttyd-client

  musl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake musl-tools python3

      - name: Static musl build (no TLS)
        run: make static BUILD_DIR=build-musl TLS=0

      - name: Verify the binary is static
        run: |
          file build-musl/ttyd-client | tee /tmp/file.txt
          grep -q "statically linked" /tmp/file.txt
          ./build-musl/ttyd-client --version

      - uses: actions/upload-artifact@v7
        with:
          name: ttyd-client.musl-x86_64
          path: build-musl/ttyd-client

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install packages
        run: brew install cmake openssl@3

      - name: Build ttyd-client
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix openssl@3)"
          cmake --build build --parallel

      - name: Smoke test
        run: ./build/ttyd-client --version

      - uses: actions/upload-artifact@v7
        with:
          name: ttyd-client.macos
          path: build/ttyd-client

  msvc:
    runs-on: windows-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_EXE: ${{ github.workspace }}/vcpkg/vcpkg.exe
      VCPKG_TRIPLET: x64-windows-static
      TOOLCHAIN_FILE: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
    steps:
      - uses: actions/checkout@v6

      - name: Checkout vcpkg
        uses: actions/checkout@v6
        with:
          repository: microsoft/vcpkg
          path: vcpkg

      - name: Bootstrap vcpkg
        shell: pwsh
        run: ${{ github.workspace }}/vcpkg/bootstrap-vcpkg.bat

      - name: Install dependencies
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = "${{ env.VCPKG_ROOT }}"
          ${{ env.VCPKG_EXE }} install --triplet ${{ env.VCPKG_TRIPLET }} openssl getopt-win32

      - name: Build with MSVC
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = "${{ env.VCPKG_ROOT }}"
          cmake -S . -B build -G "Visual Studio 18 2026" -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="${{ env.TOOLCHAIN_FILE }}" -DVCPKG_TARGET_TRIPLET=${{ env.VCPKG_TRIPLET }}
          cmake --build build --config Release

      - name: Smoke test
        run: build/Release/ttyd-client.exe --version

      - uses: actions/upload-artifact@v7
        with:
          name: ttyd-client.msvc
          path: build/Release/ttyd-client.exe

  cross:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: i686
            build_tls: 1
          - target: x86_64
            build_tls: 1
          - target: arm
            build_tls: 1
          - target: armhf
            build_tls: 1
          - target: aarch64
            build_tls: 1
          - target: mips
            build_tls: 1
          - target: mipsel
            build_tls: 1
          - target: mips64
            build_tls: 1
          - target: mips64el
            build_tls: 1
          - target: ppc64
            build_tls: 0
          - target: ppc64le
            build_tls: 0
          - target: s390x
            build_tls: 1
          - target: win32
            build_tls: 0
    steps:
      - uses: actions/checkout@v6

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake build-essential cmake curl file libtool patch perl

      - name: Cross build (${{ matrix.target }})
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_TLS: ${{ matrix.build_tls }}
        run: ./scripts/cross-build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: ttyd-client.${{ matrix.target }}
          path: build/ttyd-client*
