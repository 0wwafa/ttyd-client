name: docker

on:
  push:
    branches: main
    tags: ["*"]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake build-essential cmake curl file libtool patch perl
      - name: Cross build multi-arch binary (with static OpenSSL)
        run: |
          mkdir dist
          for arch in amd64 armv7 arm64 s390x; do
            env BUILD_TARGET=$arch BUILD_TLS=1 ./scripts/cross-build.sh
            [ "$arch" = "armv7" ] && arch="arm"
            mkdir -p dist/$arch && cp build/ttyd-client.* dist/$arch/ttyd-client
          done
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: ${{ secrets.DOCKER_HUB_USER != '' }}
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Determine docker tags
        id: docker_tag
        run: |
          # Only the tag itself goes into the environment: the image reference
          # prefix is added by the build steps below.
          case $GITHUB_REF in
            refs/tags/*)
              TAG_NAME=${GITHUB_REF#refs/tags/}
              TAG_NAME=${TAG_NAME#v}
              {
                echo "DOCKER_TAGS<<__EOF__"
                echo "${TAG_NAME}"
                echo "latest"
                echo "__EOF__"
                echo "ALPINE_TAGS<<__EOF__"
                echo "${TAG_NAME}-alpine"
                echo "alpine"
                echo "__EOF__"
              } >> $GITHUB_ENV
              ;;
            *)
              echo "DOCKER_TAGS=latest" >> $GITHUB_ENV
              echo "ALPINE_TAGS=alpine" >> $GITHUB_ENV
              ;;
          esac
      - name: build/push docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm/v7,linux/arm64,linux/s390x
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.DOCKER_TAGS }}
      - name: build/push docker image (alpine)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.alpine
          platforms: linux/amd64,linux/arm/v7,linux/arm64,linux/s390x
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.ALPINE_TAGS }}
