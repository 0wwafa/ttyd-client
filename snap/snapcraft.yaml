name: ttyd-client
adopt-info: ttyd-client
summary: Command line client for ttyd
description: |
 ttyd-client connects your terminal to a terminal shared by a ttyd server,
 using the same websocket protocol as the ttyd web frontend

grade: stable
confinement: classic
base: core20
compression: lzo

license: MIT

apps:
  ttyd-client:
    command: usr/bin/ttyd-client

parts:
  ttyd-client:
    source: https://github.com/0wwafa/ttyd-client
    source-type: git
    plugin: cmake
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DTC_WITH_TLS=ON

    override-pull: |
      snapcraftctl pull
      snapcraftctl set-version "$(git describe --tags | sed 's/^v//' | cut -d "-" -f1)"

    build-packages:
      - build-essential
      - libssl-dev
